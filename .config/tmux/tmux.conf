##### CORE BEHAVIOR & INPUT #####

# Enable mouse support (scroll, select panes, resize)
set -g mouse on

# Use vi-style keys in copy/scroll mode
set-window-option -g mode-keys vi


##### TERMINAL / UI CAPABILITIES #####

# Allow applications to detect when a tmux pane or window gains or loses focus
# Without this option, those programs behave as if they’re always focused, even when you switch windows.
# set-option -g focus-events on

# Advertise truecolor / extended terminal features
set-option -a terminal-features 'tmux-256color'
set -ag terminal-overrides ",xterm-256color:RGB"


##### WINDOW & PANE INDEXING #####

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1


##### PREFIX & SESSION BEHAVIOR #####

# Set new prefix key
set -g prefix C-a

# Do not exit tmux when the last session is closed
set -g detach-on-destroy off

# Enable focus events so tmux reports when panes/windows gain or lose focus (required for Neovim autoread/checktime to work reliably)
set -g focus-events on

##### KEY BINDINGS #####

# Reload tmux config without restarting
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# Clear terminal like Ctrl+l
bind-key -n C-l send-keys C-l \; send-keys -R \; clear-history

# Kill pane immediately without confirmation
bind-key x kill-pane

# Move between panes using vi motions
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Open a pane to the right in the current directory
bind-key | split-window -h -c "#{pane_current_path}"

# Move fast among sessions
bind-key n switch-client -n
bind-key p switch-client -p

# Resize panes
bind-key < resize-pane -L 10
bind-key > resize-pane -R 10
bind-key + resize-pane -D 10
bind-key - resize-pane -U 10

##### POPUPS / SESSION MANAGEMENT #####

# Tmux session picker (Alt + s) using sesh + fzf
bind-key -n M-s display-popup -E -w 75% -h 60% -T " sesh " "$HOME/scripts/tmux/sesh-sessions/sesh-menu"

# Open Lazygit in a popup window
bind-key g display-popup -d "#{pane_current_path}" -w 80% -h 80% -E lazygit


##### PLUGINS #####

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Sensible defaults
set -g @plugin 'tmux-plugins/tmux-sensible'

# Seamless vim <-> tmux navigation
set -g @plugin 'christoomey/vim-tmux-navigator'


##### TPM INITIALIZATION (MUST BE LAST) #####

run '~/.config/tmux/plugins/tpm/tpm'
